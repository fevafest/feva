services:
  - type: web
    name: feva-fest-api
    runtime: node
    rootDir: backend
    plan: free # bump to "starter" or higher to enable the persistent disk below
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    # Uncomment once you're on a paid plan (free-tier services can't attach
    # disks). This gives uploaded event posters/blog covers/avatars a real
    # persistent volume that survives deploys and restarts, instead of the
    # ephemeral filesystem. Also set UPLOADS_DIR below to the same mountPath.
    # disk:
    #   name: feva-fest-uploads
    #   mountPath: /var/data/uploads
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false # set to your Vercel frontend URL, e.g. https://feva-fest.vercel.app
      # - key: UPLOADS_DIR
      #   value: /var/data/uploads # only once the disk above is enabled
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PAYHERO_API_BASE_URL
        value: https://backend.payhero.co.ke/api/v2
      - key: PAYHERO_USERNAME
        sync: false
      - key: PAYHERO_PASSWORD
        sync: false
      - key: PAYHERO_CHANNEL_ID
        sync: false
      - key: PAYHERO_CALLBACK_URL
        sync: false # set to https://<this-service>.onrender.com/api/payments/payhero/callback
      - key: PLATFORM_FEE_PERCENT
        value: 0.05
      - key: PLATFORM_FEE_FIXED
        value: 0
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_SECURE
        value: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: FEVA FEST <no-reply@fevafest.co.ke>
