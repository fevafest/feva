<div class="auth-page">
  <div class="auth-card card">
    <a routerLink="/" class="auth-brand">
      <app-logo [height]="44" />
    </a>

    <h1>Welcome back</h1>
    <p class="auth-subtitle">Log in to book tickets and manage your orders.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label class="form-label">Email or Phone Number</label>
        <input
          class="form-control"
          type="text"
          formControlName="identifier"
          placeholder="you@example.com or 0712345678"
          autocomplete="username"
        />
        <div class="form-error" *ngIf="form.get('identifier')?.touched && form.get('identifier')?.invalid">
          Enter your email or phone number.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-field">
          <input
            class="form-control"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
          />
          <button type="button" class="toggle-pw" (click)="showPassword.set(!showPassword())">
            <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </div>
        <div class="form-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          Password is required.
        </div>
      </div>

      <div class="auth-row">
        <a routerLink="/auth/forgot-password">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Logging in...' : 'Log In' }}
      </button>
    </form>

    <p class="auth-footer-text">
      Don't have an account? <a routerLink="/auth/register">Create one</a>
    </p>
  </div>
</div>
