<div class="auth-page">
  <div class="auth-card card">
    <a routerLink="/" class="auth-brand">
      <span class="brand-mark">FEVA</span><span class="brand-mark-alt">FEST</span>
    </a>

    <h1>Set a new password</h1>
    <p class="auth-subtitle">Choose a new password for your account.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label class="form-label">New password</label>
        <div class="password-field">
          <input
            class="form-control"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="At least 6 characters"
          />
          <button type="button" class="toggle-pw" (click)="showPassword.set(!showPassword())">
            <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </div>
        <div class="form-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm password</label>
        <input class="form-control" type="password" formControlName="confirmPassword" placeholder="Re-enter password" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        {{ loading() ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>
  </div>
</div>
