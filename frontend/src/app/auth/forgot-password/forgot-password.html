<div class="auth-page">
  <div class="auth-card card">
    <a routerLink="/" class="auth-brand">
      <span class="brand-mark">FEVA</span><span class="brand-mark-alt">FEST</span>
    </a>

    <ng-container *ngIf="!submitted()">
      <h1>Forgot your password?</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-group">
          <label class="form-label">Email address</label>
          <input class="form-control" type="email" formControlName="email" placeholder="you@example.com" />
          <div class="form-error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">
            Enter a valid email address.
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
          {{ loading() ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>
    </ng-container>

    <div class="auth-success-box" *ngIf="submitted()">
      <div class="success-icon">
        <app-icon name="mail" [size]="26" />
      </div>
      <h1>Check your email</h1>
      <p>If an account exists for that address, a password reset link has been sent.</p>
      <a *ngIf="devResetUrl() as url" class="dev-link" [href]="url">
        Dev mode link: continue to reset password
      </a>
    </div>

    <p class="auth-footer-text">
      Remembered your password? <a routerLink="/auth/login">Log in</a>
    </p>
  </div>
</div>
