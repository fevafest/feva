<a class="event-card" [routerLink]="['/events', event.slug]">
  <div class="poster-wrap">
    <img [src]="event.posterImage | fileUrl" [alt]="event.title" loading="lazy" />
    <span class="badge badge-red category-badge">{{ event.category }}</span>
  </div>

  <div class="card-body">
    <div class="date-line">{{ dateLabel }} &middot; {{ event.startTime }}</div>
    <h3 class="event-title">{{ event.title }}</h3>
    <div class="venue-line">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 21s-7-6.5-7-11a7 7 0 1 1 14 0c0 4.5-7 11-7 11z" />
        <circle cx="12" cy="10" r="2.5" />
      </svg>
      <span>{{ event.venue }}, {{ event.location }}</span>
    </div>

    <div class="card-footer">
      <div class="price" [class.free]="isFree">
        <ng-container *ngIf="isFree">FREE</ng-container>
        <ng-container *ngIf="!isFree">Starting <strong>{{ event.minPrice | kes }}</strong></ng-container>
      </div>
      <span class="btn btn-outline btn-sm">View Details</span>
    </div>
  </div>
</a>
