<div class="dash-header">
  <h1>Settings</h1>
  <p>Manage your admin account settings.</p>
</div>

<div class="settings-grid">
  <div class="card settings-card">
    <h3>Account Information</h3>
    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-control" type="text" formControlName="fullName" />
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input class="form-control" type="tel" formControlName="phoneNumber" />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" [value]="auth.currentUser()?.email" disabled />
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="savingProfile()">
        {{ savingProfile() ? 'Saving...' : 'Save Changes' }}
      </button>
    </form>
  </div>

  <div class="card settings-card">
    <h3>Change Password</h3>
    <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input class="form-control" type="password" formControlName="currentPassword" />
      </div>
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input class="form-control" type="password" formControlName="newPassword" />
      </div>
      <button type="submit" class="btn btn-dark" [disabled]="savingPassword()">
        {{ savingPassword() ? 'Updating...' : 'Change Password' }}
      </button>
    </form>
  </div>

  <div class="card settings-card">
    <h3>Platform Configuration</h3>
    <p class="config-note">
      Payment credentials, platform fee percentage and PayHero API settings are configured via
      environment variables on the backend server for security, and are not editable from this
      dashboard.
    </p>
  </div>
</div>
